<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SPRINGS-ABM{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/css/style.css?v={{ static_version }}">
  <script src="/static/vendor/htmx.min.js?v={{ static_version }}" defer></script>
  {% block head %}{% endblock %}
  <!-- results.js must load after any page-specific plotly.min.js include above (defer
       scripts run in document order), since it calls into the Plotly global. -->
  <script src="/static/js/results.js?v={{ static_version }}" defer></script>
</head>
<body>
  {% if authenticated %}
  <nav class="springs-nav">
    <span class="brand">SPRINGS-ABM</span>
    <span class="links">
      <a href="/scenario">Run a Scenario</a>
      <a href="/about">About the Model</a>
      <form method="post" action="/logout"><button type="submit" class="link-btn">Log out</button></form>
    </span>
  </nav>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
