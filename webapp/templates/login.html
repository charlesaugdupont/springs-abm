{% extends "base.html" %}
{% block title %}Log in - SPRINGS-ABM{% endblock %}
{% block content %}
<article style="max-width: 420px; margin: 4rem auto;">
  <h2>SPRINGS-ABM</h2>
  <p>This tool is shared with the SPRINGS consortium. Enter the shared password to continue.</p>
  {% if error %}<p style="color: #a02020;">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autofocus>
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
